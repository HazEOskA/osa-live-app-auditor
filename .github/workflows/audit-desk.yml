name: audit-desk

on:
  push:
    paths: ["client-website-audit-desk/**", ".github/workflows/audit-desk.yml"]
  pull_request:
    paths: ["client-website-audit-desk/**", ".github/workflows/audit-desk.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-website-audit-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-website-audit-desk/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
